name: Render lesson videos

on:
  push:
    branches: [main, 'claude/**']
    paths: ['lessons/**', 'src/**', 'scripts/**', '.github/workflows/render.yml']
  workflow_dispatch:
    inputs:
      lesson:
        description: 'Lesson number to (re-)render. Empty = every lesson without a release yet.'
        required: false

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The nightly agent may only be allowed to push claude/* branches: fold them into main first.
      - name: Merge agent branch into main
        if: startsWith(github.ref, 'refs/heads/claude/')
        run: |
          git config user.name "night-school-bot"
          git config user.email "night-school-bot@users.noreply.github.com"
          git checkout main
          git pull --ff-only origin main
          git merge --no-edit "origin/${GITHUB_REF_NAME}"
          npm_config_loglevel=silent node scripts/build-index.mjs
          git add INDEX.md && git commit -m "Update index [skip ci]" || true
          git push origin main
          git push origin --delete "${GITHUB_REF_NAME}" || true

      # Decide first: a push with nothing new to render skips all the setup below.
      - name: Pick lessons to render
        id: todo
        run: |
          if [ -n "${{ inputs.lesson }}" ]; then
            todo="${{ inputs.lesson }}"
          else
            todo=""
            shopt -s nullglob   # no lessons yet (a fresh copy of the template): render nothing
            for f in lessons/*/lesson.json; do
              n=$(node -p "require('./$f').number")
              tag=$(printf "lesson-%04d" "$n")
              gh release view "$tag" > /dev/null 2>&1 || todo="$todo $n"
            done
            # Newest two at most, so a backlog can't blow the time budget.
            todo=$(echo $todo | tr ' ' '\n' | sort -n | tail -2 | xargs)
          fi
          todo=$(echo $todo | xargs)   # trim: an output of " " must count as "nothing to render"
          echo "lessons=$todo" >> "$GITHUB_OUTPUT"
          echo "To render: ${todo:-nothing}"

      - uses: actions/setup-node@v4
        if: steps.todo.outputs.lessons != ''
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        if: steps.todo.outputs.lessons != ''
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/render.yml

      - name: System packages (espeak-ng for TTS, Chrome deps for Remotion)
        if: steps.todo.outputs.lessons != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 \
            libpango-1.0-0 libcairo2 libcups2 > /dev/null
          echo "KOKORO_ESPEAK_LIB=$(ldconfig -p | grep -m1 'libespeak-ng.so.1 ' | awk '{print $NF}')" >> "$GITHUB_ENV"
          echo "KOKORO_ESPEAK_DATA=$(dirname "$(dpkg -L espeak-ng-data | grep -m1 '/phontab$')")" >> "$GITHUB_ENV"

      - if: steps.todo.outputs.lessons != ''
        run: pip install -q kokoro-onnx==0.6.1 numpy

      - uses: actions/cache@v4
        if: steps.todo.outputs.lessons != ''
        with:
          path: models
          key: kokoro-v1.0

      - if: steps.todo.outputs.lessons != ''
        run: npm ci --no-audit --no-fund

      - name: Voice, render and publish
        if: steps.todo.outputs.lessons != ''
        run: |
          for n in ${{ steps.todo.outputs.lessons }}; do
            dir=$(ls -d lessons/$(printf "%04d" "$n")-*)
            slug=$(basename "$dir")
            title=$(node -p "const l=require('./$dir/lesson.json'); '#'+l.number+' · '+l.track.toUpperCase()+' · '+l.title")
            echo "::group::TTS lesson $n"
            python scripts/tts.py "$n"
            echo "::endgroup::"
            echo "::group::Render lesson $n"
            npm run -s render -- "$n"
            echo "::endgroup::"
            mv "out/L$(printf "%04d" "$n").mp4" "out/${slug}.mp4"
            cp "public/audio/L$(printf "%04d" "$n")/timings.json" "out/timings.json"
            npx tsx scripts/release-notes.ts "$n" > out/notes.md
            tag=$(printf "lesson-%04d" "$n")
            if gh release view "$tag" > /dev/null 2>&1; then
              gh release upload "$tag" "out/${slug}.mp4" out/timings.json --clobber
              gh release edit "$tag" --title "$title" --notes-file out/notes.md
            else
              gh release create "$tag" "out/${slug}.mp4" out/timings.json --title "$title" --notes-file out/notes.md --target main
            fi
          done

      # The nightly agent can't download release assets from its sandbox, but it can
      # fetch git branches: publish the fresh renders on a throwaway `media` branch.
      - name: Publish renders on the media branch
        if: steps.todo.outputs.lessons != ''
        run: |
          mkdir -p /tmp/media
          for n in ${{ steps.todo.outputs.lessons }}; do
            p=$(printf "%04d" "$n")
            slug=$(basename "$(ls -d lessons/${p}-*)")
            cp "out/${slug}.mp4" "/tmp/media/${p}.mp4"
            cp "public/audio/L${p}/timings.json" "/tmp/media/${p}.timings.json"
          done
          cd /tmp/media
          [ -n "$(ls -A)" ] || { echo "nothing to publish"; exit 0; }
          git init -q -b media
          git add -A
          git -c user.name=night-school-bot -c user.email=night-school-bot@users.noreply.github.com commit -qm "media: lessons ${{ steps.todo.outputs.lessons }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" media
